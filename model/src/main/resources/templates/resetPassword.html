<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        html, body {
            background-image: url(https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />

    <script>
        function checkPasswordMatch(fieldConfirmPassword) {
            const password = document.getElementById("password").value;
            if (fieldConfirmPassword.value !== password) {
                fieldConfirmPassword.setCustomValidity("Passwords do not match!");
            } else {
                fieldConfirmPassword.setCustomValidity("");
            }
        }
    </script>
</head>

<body class="bg-[#e8c1a0] flex items-center justify-center min-h-screen">

    <!-- Reset Password Container -->
    <div class="bg-[#0a043c] text-white rounded-lg p-8 w-80">

        <!-- Reset Password Heading -->
        <h2 class="text-xl font-semibold text-center mb-2">Reset Your Password</h2>

        <!-- Reset Password Form -->
        <form th:action="@{/resetPassword}" method="post">
            <input type="hidden" name="token" th:value="${token}" />

            <!-- New Password Field -->
            <div class="mb-4">
                <label class="block text-sm mb-2" for="password">
                    <i class="fas fa-lock mr-2"></i> New Password
                </label>
                <input class="w-full px-3 py-2 text-black rounded" id="password" name="password" type="password" placeholder="Enter your new password" required autofocus />
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-4">
                <label class="block text-sm mb-2" for="confirmPassword">
                    <i class="fas fa-lock mr-2"></i> Confirm Password
                </label>
                <input class="w-full px-3 py-2 text-black rounded" id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your new password" required oninput="checkPasswordMatch(this);" />
            </div>

            <!-- Submit Button -->
            <button class="w-full bg-[#b392ac] text-white py-2 rounded mb-4 hover:bg-[#9a798f] transition duration-300">
                Change Password
            </button>
        </form>
    </div>
    
</body>
</html>
