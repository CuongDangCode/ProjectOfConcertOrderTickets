<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        html, body {
            background-image: url(https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-[#e8c1a0] flex items-center justify-center min-h-screen">

    <!-- Forgot Password Container -->
    <div class="bg-[#0a043c] text-white rounded-lg p-8 w-80">

        <!-- Forgot Password Text -->
        <h2 class="text-xl font-semibold text-center mb-2">Forgot Password</h2>
        <p class="text-center text-sm mb-6">We will send a reset password link to your email.</p>

        <!-- Error/Message Display -->
        <!-- <div class="error-message text-red-500 text-center mb-4" th:if="${error != null}">[[${error}]]</div>
        <div class="message text-green-500 text-center mb-4" th:if="${message != null}">[[${message}]]</div> -->

        <!-- Forgot Password Form -->
        <form th:action="@{/forgotPassword}" method="post">
            <div class="mb-4">
                <label class="block text-sm mb-2" for="email">
                    <i class="fas fa-envelope mr-2"></i> Email
                </label>
                <input class="w-full px-3 py-2 text-black rounded" id="email" name="email" type="email" placeholder="Enter your email" required />
            </div>

            <!-- Submit Button -->
            <button class="w-full bg-[#b392ac] text-white py-2 rounded mb-4 hover:bg-[#9a798f] transition duration-300">
                Send
            </button>
        </form>

        <!-- Back to Login Link -->
        <div class="text-center">
            <a href="#" th:href="@{/login}" class="text-sm text-[#b392ac] hover:text-white transition duration-300">Back to Login</a>
        </div>
    </div>
    
</body>
</html>
